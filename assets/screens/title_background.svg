<svg xmlns="http://www.w3.org/2000/svg" width="1152" height="648" viewBox="0 0 1152 648">
  <defs>
    <linearGradient id="wall" x2="0" y2="1">
      <stop stop-color="#17243a"/>
      <stop offset="1" stop-color="#090f20"/>
    </linearGradient>
    <linearGradient id="floor" x2="0" y2="1">
      <stop stop-color="#46342f"/>
      <stop offset="1" stop-color="#171b2a"/>
    </linearGradient>
    <linearGradient id="painting" x2="0" y2="1">
      <stop stop-color="#f78b45"/>
      <stop offset=".42" stop-color="#efb95c"/>
      <stop offset=".52" stop-color="#398f9b"/>
      <stop offset="1" stop-color="#164c67"/>
    </linearGradient>
    <linearGradient id="portal" x2="0" y2="1">
      <stop stop-color="#fff3b0" stop-opacity=".95"/>
      <stop offset=".55" stop-color="#ffbd59" stop-opacity=".85"/>
      <stop offset="1" stop-color="#ff783c" stop-opacity=".7"/>
    </linearGradient>
    <radialGradient id="aura">
      <stop stop-color="#ffd878" stop-opacity=".46"/>
      <stop offset="1" stop-color="#ff9b45" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grain" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M0 7h2M19 23h2M8 30h1M28 4h1" stroke="#f9d59a" stroke-opacity=".12" stroke-width="2"/>
    </pattern>
    <clipPath id="painting_clip">
      <rect x="590" y="92" width="500" height="350" rx="2"/>
    </clipPath>
  </defs>

  <!-- Quiet museum interior -->
  <rect width="1152" height="648" fill="url(#wall)"/>
  <path d="M0 0h1152v64H0z" fill="#26334a" opacity=".55"/>
  <path d="M0 448h1152v200H0z" fill="url(#floor)"/>
  <path d="M0 448h1152" stroke="#a77a56" stroke-opacity=".45" stroke-width="3"/>
  <path d="M0 480l480 168M1152 480L672 648" stroke="#b98659" stroke-opacity=".09" stroke-width="3"/>
  <path d="M145 0v448M1000 0v448" stroke="#bfd1dc" stroke-opacity=".06" stroke-width="2"/>

  <!-- Framed landscape opens onto the history of Ceará -->
  <rect x="550" y="82" width="548" height="398" rx="8" fill="#070d1a" opacity=".65"/>
  <rect x="566" y="68" width="548" height="398" rx="7" fill="#64452f"/>
  <rect x="577" y="79" width="526" height="376" fill="#e7b772"/>
  
  <g clip-path="url(#painting_clip)">
    <rect x="590" y="92" width="500" height="350" fill="url(#painting)"/>
    
    <!-- Sol Ardente da Terra da Luz -->
    <circle cx="952" cy="188" r="105" fill="url(#aura)"/>
    <circle cx="952" cy="188" r="35" fill="#ffe5a0"/>

    <!-- Chapada do Araripe / Platô no Horizonte (Fase 2 - Cangaço e Cariri) -->
    <polygon points="590,265 670,240 760,240 820,255 900,245 980,250 1090,260 1090,320 590,320" fill="#7a4f32" opacity="0.9"/>
    <path d="M590 270l76-39 67 34 80-61 78 55 70-37 129 60v53H590z" fill="#8a5e42" opacity=".88"/>
    
    <!-- Sertão e Relevo Central -->
    <path d="M590 301l102-26 70 31 90-24 74 25 74-35 90 24v50H590z" fill="#5a7054"/>
    
    <!-- Casarão Histórico de Pedra do Patu / 1932 (Fase 3) à direita no sertão -->
    <g transform="translate(870, 275) scale(0.65)">
      <polygon points="0,30 40,5 80,30 80,68 0,68" fill="#6c6152" stroke="#383025" stroke-width="2"/>
      <polygon points="0,30 40,5 80,30" fill="#9c4a36"/>
      <rect x="15" y="38" width="12" height="16" rx="4" fill="#221d18"/>
      <rect x="35" y="38" width="12" height="16" rx="4" fill="#221d18"/>
      <rect x="55" y="38" width="12" height="16" rx="4" fill="#221d18"/>
    </g>

    <!-- Mar de Fortaleza / Litoral (Fase 1 - Dragão do Mar) -->
    <path d="M590 322l92-12 79 27 88-18 80 22 78-16 93 13v105H590z" fill="#238096"/>
    <path d="M590 364q110-18 205 0t195 0 100 0v78H590z" fill="#28647a"/>
    <path d="M604 389h40m23 14h67m32-20h45m78 31h54m57-26h39m30 20h53" stroke="#98d3c4" stroke-opacity=".52" stroke-width="3"/>

    <!-- Jangada Histórica da Abolição (Dragão do Mar, 1884) velejando no mar -->
    <g transform="translate(635, 335)">
      <!-- Vela de pano pardo -->
      <polygon points="28,-40 28,15 62,13" fill="#fefae0" stroke="#c99a58" stroke-width="1.5"/>
      <polygon points="27,-32 27,15 5,14" fill="#faedcd" opacity="0.9"/>
      <line x1="28" y1="-44" x2="28" y2="18" stroke="#4a2810" stroke-width="2"/>
      <!-- Troncos da Jangada -->
      <rect x="-2" y="14" width="72" height="7" rx="2" fill="#6f421f"/>
      <!-- Jangadeiro Chico da Matilde no leme -->
      <circle cx="35" cy="7" r="3.5" fill="#2b1810"/>
      <path d="M32 11 L38 11 L40 18 L30 18 Z" fill="#2b1810"/>
    </g>

    <!-- Cactos / Mandacaru e Palmeiras da Caatinga e Litoral -->
    <path d="M721 347v-78m2 8-45-42m45 42 39-55m-39 55 59-27m-59 27-64-12" stroke="#263f38" stroke-width="9" stroke-linecap="square"/>
    <path d="M723 270l-54-57 45 24-15-42 29 52 27-48-8 53 48-20-47 38" fill="#315a43" stroke="#1c3b36" stroke-width="4"/>
    <path d="M1033 385v-47q0-14 12-14t12 14v17q0-11 10-11t10 12v29m-44-18q-13-3-15 9t15 13" fill="none" stroke="#315a43" stroke-width="9" stroke-linecap="square"/>
    <path d="M1063 422h27" stroke="#eec178" stroke-opacity=".75" stroke-width="4"/>

    <!-- Plaqueta dourada sutil dentro da moldura com referência histórica -->
    <rect x="605" y="418" width="210" height="16" rx="2" fill="#22160d" opacity="0.75"/>
    <text x="612" y="430" fill="#eec178" font-size="9" font-family="sans-serif" font-weight="bold" letter-spacing="1">MEMÓRIAS DA TERRA DA LUZ</text>
  </g>

  <!-- Portal de luz místico que se abre no museu -->
  <ellipse cx="827" cy="498" rx="186" ry="92" fill="url(#aura)"/>
  <path d="M748 447v-90a79 79 0 0 1 158 0v90" fill="none" stroke="#f4a14e" stroke-opacity=".52" stroke-width="18"/>
  <path d="M761 447v-90a66 66 0 0 1 132 0v90z" fill="url(#portal)" stroke="#ffe6a0" stroke-width="4"/>
  <path d="M777 447v-90a50 50 0 0 1 100 0v90z" fill="#fff5cc" opacity=".42"/>
  <path d="M698 462h260" stroke="#ffbd65" stroke-opacity=".68" stroke-width="4"/>
  <path d="M713 476l-45 21m306-21 45 21m-260 0-25 18m214-18 25 18" stroke="#ffc66d" stroke-opacity=".55" stroke-width="3"/>
  <path d="M827 485v62m-94-48 43 39m145-39-43 39" stroke="#e3aa68" stroke-opacity=".19" stroke-width="3"/>

  <!-- Gallery spotlights and atmospheric pixel grain -->
  <path d="M285 0h180l174 448H220z" fill="#7c8eab" opacity=".035"/>
  <path d="M710 0h210l-55 95H755z" fill="#ffd89a" opacity=".13"/>
  <rect width="1152" height="648" fill="url(#grain)"/>
  <rect width="1152" height="648" fill="#07101e" opacity=".12"/>
</svg>
